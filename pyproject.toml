[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-lint"
version = "0.1.0"
description = "Static linter for ComfyUI API-format workflow JSON - catch broken workflows before they reach the GPU."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tangyi Studio" }]
keywords = ["comfyui", "workflow", "linter", "validation", "stable-diffusion", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/TangyiStudio/comfy-lint"
Source = "https://github.com/TangyiStudio/comfy-lint"
Issues = "https://github.com/TangyiStudio/comfy-lint/issues"

[project.scripts]
comfy-lint = "comfy_lint.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
